<div class="w-screen h-screen flex container mx-auto">
  <div class="flex w-full lg:max-w-md flex-col justify-center items-start px-8">
    <div class="w-full mt-8 text-right flex justify-between items-center">
      <div class="flex items-center gap-2">
        <!-- TODO: UI Logo component -->
        <h2 class="text-xl font-semibold text-black">Otterly</h2>
      </div>
      <a [routerLink]="'/auth/register'" class="otterly-link text-sm">Create an account</a>
    </div>
    <div class="flex flex-1"></div>
    <div class="w-full flex justify-center lg:justify-start items-center">
      <div class="w-16 h-16 rounded-lg border flex justify-center items-center mb-4">
          <ng-icon name="lucideLogIn" class="text-2xl text-primary"></ng-icon>
      </div>
    </div>
    <div class="my-2 flex flex-col">
      <h1 class="text-2xl font-bold lg:text-start text-center">Welcome back!</h1>
      <p class="text-xs text-tertiary-light lg:text-start text-center mb-4">
        Please enter your login credentials
      </p>
    </div>
    <app-login-form class="w-full"></app-login-form>
    <div class="flex flex-1"></div>
  </div>
  <div class="lg:flex flex-1 hidden p-2">
    <div class="w-full h-full rounded-lg bg-background-secondary"></div>
  </div>
</div>
