<div cdkOverlayOrigin #profileMenuButton="cdkOverlayOrigin">
  @if (activeUser){
  <button type="button" class="flex items-center gap-2" (click)="this.profileMenuOpen = !this.profileMenuOpen">
      <ui-user-avatar [user]="activeUser" class="w-10 h-10" />
  </button>
  <ng-template
    cdkConnectedOverlay
    [cdkConnectedOverlayHasBackdrop]="true"
    [cdkConnectedOverlayBackdropClass]="['cdk-overlay-transparent-backdrop']"
    (backdropClick)="profileMenuOpen = false"
    [cdkConnectedOverlayOrigin]="profileMenuButton"
    [cdkConnectedOverlayOpen]="profileMenuOpen">
    <app-profile-dropdown [user]="activeUser"></app-profile-dropdown>
  </ng-template>
  }
</div>
